
name : MSBuild

env :
  SOLUTION_FILE_PREFIX : Mock

jobs :
  build :
    runs-on : windows-latest

    strategy :
      fail-fast : false

      matrix :
        build-type : [ Release, Debug ]
        target-ver : [ "" ]

    steps :
      - name : Checkout Mock Repository
        uses : actions/checkout@v7
        with :
          path       : "${{ github.workspace }}/mock-repo"
          repository : "takahiro-itou/BaseballScoreMock"
          submodules : recursive

      - name : Rename WpfModules Directory in Mock
        run  : |
          Rename-Item  -Path "${{ github.workspace }}/mock-repo/WpfModules"  -NewName "WpfModules.bak"  -Force
        shell : pwsh

      - name : Checkout
        uses : actions/checkout@v7
        with :
          path       : "${{ github.workspace }}/mock-repo/WpfModules"
          submodules : recursive

      - name : Setup MSBuild
        uses : microsoft/setup-msbuild@v3
        with :
          msbuild-architecture : x64

      - name : Check
        run  : |
          msbuild  --version
          DIR  mock-repo
        shell : pwsh

      - name : Build
        working-directory : "${{ github.workspace }}/mock-repo"
        run  : >
          msbuild -restore -t:Rebuild -p:Platform=x64 -p:Configuration="${{ matrix.build-type }}" "${{ env.solution-file }}"
        env  :
          solution-file : "${{ env.SOLUTION_FILE_PREFIX }}${{ matrix.target-ver }}.sln"
        shell : pwsh

on :
  push :
    branches : [ "master", "develop" ]
  pull_request :
    branches : [ "master", "develop" ]
  workflow_dispatch :
